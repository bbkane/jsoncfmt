[package]
edition = "2024"
name = "jsoncfmt"
version = "0.0.1"
[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.7"
dprint-plugin-json = "0.25.0"
jsonc-parser = { version = "0.34.0", default-features = false, features = [
  "cst",
] }

[dev-dependencies]
insta = "1.48.0"
insta-cmd = "0.7.0"
tempfile = "3.27.0"

[profile.dev.package]
insta.opt-level = 3
